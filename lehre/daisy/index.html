<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAISY</title>
    <link rel="stylesheet" href="https://unpkg.com/reveal.js/dist/reveal.css">
    <link rel="stylesheet" href="https://unpkg.com/reveal.js/dist/theme/moon.css">
    <link rel="stylesheet" href="style.css">
    <!-- <link rel="stylesheet" href="../../reveal/css/theme/serif.css" id="theme"> -->
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>


  
  <div class="reveal">

    <div class="logo-balken klg-logo">
      <img  src="img/klg.png" alt="LogoKLG">
    </div>

       
    <div class="slides">

      <!-- Title Slide -->
      <section class="show-klg-logo">
        <h2 style="margin-top:1.5em;">DAISY</h2>
	<h3>Digitales Alarm- und Informationssystem</h3>
	<h4>Algorithmik in die Klinik bringen</h4>
        <p>Prof. Dr. phil. nat. René Staritzbichler, 5.11.2026</p>
        <img style="width:20%;margin-left:0em;" src="img/ml_probe.png">
      </section>
      
      
            
   	    
	    
	    
    </div>
  </div>
  <!--
      <script src="https://unpkg.com/reveal.js/dist/reveal.js"></script>
      <script src="https://unpkg.com/reveal.js/dist/plugin/math.js"></script>
      -->
  <script src="src/reveal.js"></script>
  <script src="src/math.js"></script>

  <script>
    Reveal.initialize({
	plugins: [RevealMath.KaTeX],
	slideNumber: 'c/t',
	controls: false
    });
  </script>

  
  <script>
    const logo = document.querySelector('.deck-logo');

    function updateLogo(event) {
	logo.hidden = !event.currentSlide.hasAttribute('data-show-logo');
    }

    Reveal.on('ready', updateLogo);
    Reveal.on('slidechanged', updateLogo);
  </script>

  
  <script>
    Reveal.initialize();
  </script>


  
</body>
</html>
